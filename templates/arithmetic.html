{% extends 'base.html' %}{% block title %}算术练习{% endblock %}{% block crumb %}趣味数学 / 算术练习{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">ARITHMETIC PRACTICE</div><h1>{{ t.arithmetic }}</h1><p>遵循先乘除后加减的顺序，每题 10 分。</p></div><div class="timer-pill">◷ <span id="timer">00:00</span></div></div><form class="panel quiz-panel" action="/arithmetic/submit" method="post" id="quizForm"><div class="quiz-grid">{% for q in questions %}<div class="question"><label for="answer_{{ loop.index0 }}"><span class="question-index">{{ '%02d'|format(loop.index) }}</span>{{ q.expression }} =</label><input id="answer_{{ loop.index0 }}" type="number" name="answer_{{ loop.index0 }}" min="0" max="100" step="1" required autocomplete="off" placeholder="答案"></div>{% endfor %}</div><div class="quiz-bottom"><a href="/math" class="text-link">← 返回数学乐园</a><button class="button primary" type="submit">{{ t.submit }} →</button></div></form>
{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='timer.js') }}" defer></script>{% endblock %}
