<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('upload') }} - {{ t('title') }}</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --green: #10b981;
            --red: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 40px 20px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 800px; }
        .back-link {
            display: inline-block; color: #60a5fa;
            text-decoration: none; margin-bottom: 20px; font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .window-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px; padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }
        .window-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }
        .window-title { font-size: 1.1rem; font-weight: 600; }
        .window-dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #f59e0b; }
        .dot-green { background-color: #10b981; }

        .toolbar {
            display: flex; gap: 10px; align-items: center;
            flex-wrap: wrap; margin-bottom: 20px;
        }
        .btn {
            background: var(--accent-gradient); color: white;
            border: none; padding: 10px 20px; border-radius: 8px;
            font-weight: 600; cursor: pointer; text-decoration: none;
            display: inline-block; font-size: 0.95rem;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background: transparent; border: 1px solid var(--card-border);
            color: var(--text-main);
        }
        select {
            background: var(--card-bg); color: var(--text-main);
            border: 1px solid var(--card-border); border-radius: 8px;
            padding: 8px 12px; font-size: 0.95rem;
        }

        .upload-area {
            border: 2px dashed var(--card-border);
            padding: 30px; text-align: center;
            border-radius: 12px;
            background-color: rgba(15, 23, 42, 0.4);
            margin-bottom: 20px;
        }
        .upload-area input[type="file"] {
            color: var(--text-muted); margin: 15px 0;
        }

        .preview-img {
            max-width: 100%; max-height: 300px;
            border-radius: 8px; margin-top: 15px;
            border: 1px solid var(--card-border);
        }

        .result-box {
            margin-top: 20px; padding: 16px;
            background: rgba(59,130,246,0.1);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 10px;
        }
        .result-row {
            display: flex; justify-content: space-between;
            padding: 6px 0; font-size: 1rem;
        }
        .result-label { color: var(--text-muted); }
        .result-value { font-family: Consolas, monospace; }
        .result-value.ok { color: var(--green); font-weight: 700; }
        .result-value.no { color: var(--red); font-weight: 700; }

        .tip {
            color: var(--text-muted); font-size: 0.85rem;
            margin-top: 12px; line-height: 1.6;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="{{ url_for('math_practice.practice', lang=lang) }}" class="back-link">
        ← {{ t('title') }}
    </a>

    <div class="window-card">
        <div class="window-header">
            <div class="window-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <span class="window-title">ocr_scanner.exe - {{ t('upload') }}</span>
        </div>

        <div class="toolbar">
            <a href="{{ url_for('math_practice.practice', lang=lang) }}" class="btn btn-secondary">
                🧮 {{ t('title') }}
            </a>
            <a href="{{ url_for('math_practice.history', lang=lang) }}" class="btn btn-secondary">
                📜 {{ t('history') }}
            </a>
            <select onchange="switchLang(this.value)">
                <option value="zh" {% if lang=='zh' %}selected{% endif %}>中文</option>
                <option value="en" {% if lang=='en' %}selected{% endif %}>English</option>
                <option value="ja" {% if lang=='ja' %}selected{% endif %}>日本語</option>
            </select>
        </div>

        <p style="color: var(--text-muted); margin-top: 0;">
            {{ t('upload') }}：上传一张包含算式的图片，系统会自动识别并批改。
        </p>

        <form id="uploadForm" onsubmit="return false;">
            <div class="upload-area">
                <p>📷 选择图片（PNG / JPG）：</p>
                <input type="file" id="imageInput" accept="image/*">
                <br>
                <img id="preview" class="preview-img" style="display:none;">
                <br>
                <label style="color: var(--text-muted); font-size: 0.9rem;">
                    {{ t('your_answer') }}：
                </label>
                <input class="btn-secondary" type="text" id="userAnswer"
                       placeholder="{{ t('expr_placeholder') }}"
                       style="padding: 8px 12px; border-radius: 8px;
                              background: rgba(15,23,42,0.8);
                              color: var(--text-main);
                              border: 1px solid var(--card-border);
                              margin-left: 8px; width: 120px;">
                <br><br>
                <button class="btn" onclick="uploadImage()">
                    🚀 {{ t('submit') }}
                </button>
            </div>
        </form>

        <div class="result-box" id="resultBox" style="display:none;">
            <div class="result-row">
                <span class="result-label">识别出的算式</span>
                <span class="result-value" id="rExpr">-</span>
            </div>
            <div class="result-row">
                <span class="result-label">{{ t('standard') }}</span>
                <span class="result-value" id="rStd">-</span>
            </div>
            <div class="result-row">
                <span class="result-label">{{ t('result') }}</span>
                <span class="result-value" id="rResult">-</span>
            </div>
        </div>

        <div class="tip">
            ⚠️ OCR 识别对手写体支持有限，建议使用打印体算式。<br>
            如果服务器未安装 PaddleOCR，本功能会自动降级，返回空结果。
        </div>
    </div>
</div>

<script>
    function switchLang(lang) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
    }

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = document.getElementById('preview');
            img.src = ev.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);
    });

    async function uploadImage() {
        const fileInput = document.getElementById('imageInput');
        if (!fileInput.files.length) {
            alert('请先选择图片');
            return;
        }

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);
        formData.append('answer', document.getElementById('userAnswer').value.trim());

        const res = await fetch("{{ url_for('math_practice.api_ocr') }}", {
            method: 'POST',
            body: formData
        });
        const data = await res.json();

        const box = document.getElementById('resultBox');
        box.style.display = 'block';

        if (data.error && !data.expr) {
            document.getElementById('rExpr').textContent = '(识别失败)';
            document.getElementById('rStd').textContent = '-';
            document.getElementById('rResult').textContent = '-';
            return;
        }

        document.getElementById('rExpr').textContent = data.expr || '-';

        const stdEl = document.getElementById('rStd');
        stdEl.textContent = data.standard ?? '-';

        const r = document.getElementById('rResult');
        if (data.correct) {
            r.textContent = '✓ 正确';
            r.className = 'result-value ok';
            stdEl.className = 'result-value';
        } else {
            r.textContent = '✗ 错误';
            r.className = 'result-value no';
            stdEl.className = 'result-value ok';
        }
    }
</script>
</body>
</html>
