<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('title') }}</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --green: #10b981;
            --red: #ef4444;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 40px 20px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 900px; }
        .back-link {
            display: inline-block; color: #60a5fa;
            text-decoration: none; margin-bottom: 20px; font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        .window-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px; padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }
        .window-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 20px; border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }
        .window-title { font-size: 1.1rem; font-weight: 600; }
        .window-dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #f59e0b; }
        .dot-green { background-color: #10b981; }

        .toolbar {
            display: flex; gap: 10px; align-items: center;
            flex-wrap: wrap; margin-bottom: 20px;
        }
        .btn {
            background: var(--accent-gradient); color: white;
            border: none; padding: 10px 20px; border-radius: 8px;
            font-weight: 600; cursor: pointer; text-decoration: none;
            display: inline-block; font-size: 0.95rem;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background: transparent; border: 1px solid var(--card-border);
            color: var(--text-main);
        }
        select {
            background: var(--card-bg); color: var(--text-main);
            border: 1px solid var(--card-border); border-radius: 8px;
            padding: 8px 12px; font-size: 0.95rem;
        }

        .q-list { display: flex; flex-direction: column; gap: 12px; }
        .q-item {
            display: grid; grid-template-columns: 40px 1fr 140px 70px;
            gap: 12px; align-items: center;
            background: rgba(15,23,42,0.5);
            border: 1px solid var(--card-border);
            border-radius: 10px; padding: 12px 16px;
            transition: border-color 0.2s;
        }
        .q-item.row-ok { border-color: rgba(16, 185, 129, 0.5); }
        .q-item.row-no { border-color: rgba(239, 68, 68, 0.5); }
        .q-no { color: var(--text-muted); font-size: 0.9rem; }
        .q-expr { font-size: 1.1rem; font-family: 'Consolas', monospace; }
        .q-input {
            background: rgba(15,23,42,0.8); color: var(--text-main);
            border: 1px solid var(--card-border); border-radius: 6px;
            padding: 8px 10px; width: 100%; font-size: 1rem;
        }
        .q-input:focus { outline: none; border-color: var(--accent-color); }
        .q-mark { font-size: 1.2rem; text-align: center; line-height: 1.2; }
        .q-mark.ok { color: var(--green); }
        .q-mark.no { color: var(--red); }
        .std-ans {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--green);
            font-family: 'Consolas', monospace;
            margin-top: 2px;
        }

        .stats {
            display: flex; gap: 20px; margin-top: 20px;
            padding: 16px; background: rgba(59,130,246,0.1);
            border-radius: 10px; border: 1px solid rgba(59,130,246,0.2);
        }
        .stat-item { flex: 1; text-align: center; }
        .stat-value { font-size: 1.6rem; font-weight: 700; color: #60a5fa; }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); }

        .empty-tip {
            text-align: center; color: var(--text-muted);
            padding: 40px 0; font-size: 0.95rem;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="{{ url_for('index') }}" class="back-link">← {{ t('back_home') }}</a>

    <div class="window-card">
        <div class="window-header">
            <div class="window-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <span class="window-title">数学练习 - {{ t('title') }}</span>
        </div>

        <div class="toolbar">
            <button class="btn" onclick="loadQuestions()">🔄 {{ t('start') }}</button>
            <a href="{{ url_for('math_practice.history', lang=lang) }}" class="btn btn-secondary">
                📜 {{ t('history') }}
            </a>
            <a href="{{ url_for('math_practice.upload', lang=lang) }}" class="btn btn-secondary">
                📷 {{ t('upload') }}
            </a>
            <select onchange="switchLang(this.value)">
                <option value="zh" {% if lang=='zh' %}selected{% endif %}>中文</option>
                <option value="en" {% if lang=='en' %}selected{% endif %}>English</option>
                <option value="ja" {% if lang=='ja' %}selected{% endif %}>日本語</option>
            </select>
        </div>

        <div class="q-list" id="qList">
            <div class="empty-tip">{{ t('start') }} →</div>
        </div>

        <div style="margin-top: 20px; text-align: center;" id="submitBar" hidden>
            <button class="btn" onclick="submitAll()">✅ {{ t('submit') }}</button>
        </div>

        <div class="stats" id="stats" style="display:none;">
            <div class="stat-item">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">{{ t('total') }}</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statCorrect">0</div>
                <div class="stat-label">{{ t('correct') }}</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statAcc">0%</div>
                <div class="stat-label">{{ t('accuracy') }}</div>
            </div>
        </div>
    </div>
</div>

<script>
    const I18N = {
        question: "{{ t('question', n='{n}') }}",
        placeholder: "{{ t('expr_placeholder') }}",
    };
    let currentQuestions = [];

    function switchLang(lang) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
    }

    async function loadQuestions() {
        const res = await fetch("{{ url_for('math_practice.api_questions') }}?n=10");
        const data = await res.json();
        currentQuestions = data.questions;

        const list = document.getElementById('qList');
        list.innerHTML = '';
        currentQuestions.forEach((q, i) => {
            const div = document.createElement('div');
            div.className = 'q-item';
            div.innerHTML = `
                <div class="q-no">${i + 1}</div>
                <div class="q-expr">${q.expr} =</div>
                <input class="q-input" type="text" inputmode="numeric"
                       placeholder="${I18N.placeholder}" data-idx="${i}">
                <div class="q-mark" id="mark-${i}"></div>
            `;
            list.appendChild(div);
        });

        document.getElementById('submitBar').hidden = false;
        document.getElementById('stats').style.display = 'none';
    }

    async function submitAll() {
        const items = currentQuestions.map((q, i) => {
            const input = document.querySelector(`.q-input[data-idx="${i}"]`);
            return { expr: q.expr, answer: input.value.trim() };
        });

        const res = await fetch("{{ url_for('math_practice.api_submit') }}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: items, source: 'manual' })
        });
        const data = await res.json();

        const itemNodes = document.querySelectorAll('.q-item');
        data.results.forEach((r, i) => {
            const mark = document.getElementById(`mark-${i}`);
            const item = itemNodes[i];

            if (r.correct) {
                mark.className = 'q-mark ok';
                mark.textContent = '✓';
                item.classList.add('row-ok');
            } else {
                mark.className = 'q-mark no';
                mark.innerHTML = `✗<br><span class="std-ans">${r.standard ?? '?'}</span>`;
                item.classList.add('row-no');
            }
        });

        document.getElementById('statTotal').textContent = data.total;
        document.getElementById('statCorrect').textContent = data.correct;
        document.getElementById('statAcc').textContent =
            (data.accuracy * 100).toFixed(1) + '%';
        document.getElementById('stats').style.display = 'flex';
    }
</script>
</body>
</html>
