<div class="member-grid">{% for member in team.members %}<article class="member-card"><div class="member-card-top"><span class="member-avatar">{% if member.avatar_url %}<img src="{{ member.avatar_url }}" alt="{{ member.name }}的头像">{% else %}{{ member.initials }}{% endif %}</span><span class="member-number">MEMBER / 0{{ loop.index }}</span></div><h3>{{ member.name }}</h3><div class="member-role">{{ member.role }}</div><p>{{ member.intro }}</p><div class="member-skills">{% for skill in member.skills %}<span>{{ skill }}</span>{% endfor %}</div><a class="member-link" href="{{ url_for('member_detail', member_id=member.id) }}">了解这位成员 <span>↗</span></a></article>{% endfor %}</div>
